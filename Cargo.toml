[package]
name = "famulus"
version = "0.0.6"
authors = ["Evgeny Kurnevsky <kurnevsky@gmail.com>"]
license = "AGPL-3.0+"
description = "LSP server integrating LLMs"
keywords = ["lsp", "llm", "ai"]
repository = "https://github.com/kurnevsky/famulus"
edition = "2024"
include = ["**/*.rs", "Cargo.toml", "README.md"]
readme = "README.md"

[dependencies]
lsp-server = "0.7"
lsp-types = { version = "0.97", features = ["proposed"] }
serde_json = "1.0"
anyhow = "1.0"
ropey = "1.6"
serde = { version = "1.0", features = ["rc"] }
reqwest = { version = "0.13", features = [
  "http2",
  "charset",
  "json",
  "stream",
] }
tokio = { version = "1.48", features = ["rt", "rt-multi-thread", "macros", "sync"] }
log = "0.4"
env_logger = "0.11"
dashmap = "6.1"
clap = { version = "4.5", features = ["cargo"] }
either = "1.15"
crossbeam-channel = "0.5"
ramhorns = "1.0"
derive_more = { version = "2.1", features = ["from"] }
futures-util = { version = "0.3", default-features = false }
uuid = { version = "1.23", features = ["v4"] }
